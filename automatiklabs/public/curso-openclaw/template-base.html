<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITULO_AULA}} — AutomatikLabs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ========== RESET & BASE ========== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #1A1A2E;
            --bg-card: #16213E;
            --accent: #0F3460;
            --cta: #E94560;
            --white: #FFFFFF;
            --text-muted: #A0AEC0;
            --text-dim: #718096;
            --success: #48BB78;
            --warning: #ECC94B;
            --info: #4299E1;
            --radius: 12px;
            --radius-sm: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--white);
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== HEADER ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(26, 26, 46, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0 24px;
        }

        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--cta), #ff6b81);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover { color: var(--white); }
        .breadcrumb .sep { opacity: 0.4; }
        .breadcrumb .current { color: var(--cta); font-weight: 600; }

        /* ========== LAYOUT ========== */
        .layout {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 40px;
            padding: 40px 24px;
            align-items: start;
        }

        /* ========== MAIN CONTENT ========== */
        .content { min-width: 0; }

        .lesson-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(233, 69, 96, 0.12);
            color: var(--cta);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .content h1 {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .lesson-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 40px;
            padding-bottom: 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .lesson-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .content h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 48px 0 20px;
            letter-spacing: -0.5px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
        }

        .content h3 {
            font-size: 20px;
            font-weight: 700;
            margin: 36px 0 16px;
            color: var(--white);
        }

        .content p {
            color: var(--text-muted);
            margin-bottom: 16px;
            font-size: 16px;
        }

        .content strong { color: var(--white); }

        .content ul, .content ol {
            color: var(--text-muted);
            margin: 0 0 20px 24px;
        }

        .content li { margin-bottom: 8px; }

        .content a {
            color: var(--cta);
            text-decoration: none;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
            transition: border-color 0.2s;
        }

        .content a:hover { border-color: var(--cta); }

        /* ========== COMPONENTS ========== */

        /* Tip Box */
        .tip-box {
            background: rgba(66, 153, 225, 0.08);
            border-left: 4px solid var(--info);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 20px 24px;
            margin: 24px 0;
        }

        .tip-box .box-title {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--info);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tip-box p { margin: 0; font-size: 15px; }

        /* Warning Box */
        .warning-box {
            background: rgba(236, 201, 75, 0.08);
            border-left: 4px solid var(--warning);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 20px 24px;
            margin: 24px 0;
        }

        .warning-box .box-title {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--warning);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .warning-box p { margin: 0; font-size: 15px; }

        /* Success Box */
        .success-box {
            background: rgba(72, 187, 120, 0.08);
            border-left: 4px solid var(--success);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            padding: 20px 24px;
            margin: 24px 0;
        }

        .success-box .box-title {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--success);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .success-box p { margin: 0; font-size: 15px; }

        /* Code Block */
        .code-block {
            background: #0D1117;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 20px 24px;
            margin: 24px 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #E6EDF3;
        }

        .code-block .comment { color: #8B949E; }
        .code-block .keyword { color: #FF7B72; }
        .code-block .string { color: #A5D6FF; }
        .code-block .function { color: #D2A8FF; }

        /* Checklist */
        .checklist {
            list-style: none;
            margin: 24px 0;
            padding: 0;
        }

        .checklist li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
            cursor: pointer;
        }

        .checklist li:hover { background: rgba(255, 255, 255, 0.03); }

        .checklist input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            min-width: 22px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            margin-top: 2px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .checklist input[type="checkbox"]:checked {
            background: var(--success);
            border-color: var(--success);
        }

        .checklist input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 6px;
            width: 6px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .checklist .check-label { color: var(--text-muted); }
        .checklist .check-label strong { color: var(--white); }

        /* Step Card */
        .step-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 28px;
            margin: 20px 0;
            position: relative;
        }

        .step-card .step-number {
            position: absolute;
            top: -14px;
            left: 24px;
            background: var(--cta);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .step-card h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .step-card p { margin: 0; }

        /* Comparison Table */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 15px;
        }

        .comparison-table thead {
            background: rgba(15, 52, 96, 0.5);
        }

        .comparison-table th {
            text-align: left;
            padding: 14px 18px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 2px solid rgba(233, 69, 96, 0.2);
        }

        .comparison-table td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
        }

        .comparison-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Case Card */
        .case-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 32px;
            margin: 24px 0;
            transition: border-color 0.3s;
        }

        .case-card:hover {
            border-color: rgba(233, 69, 96, 0.3);
        }

        .case-card .case-icon {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .case-card h4 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .case-card .case-subtitle {
            color: var(--cta);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .case-section {
            margin-bottom: 16px;
        }

        .case-section:last-child { margin-bottom: 0; }

        .case-section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .case-section p { margin: 0; font-size: 15px; }

        .case-result {
            background: rgba(72, 187, 120, 0.08);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
        }

        .case-result p { color: var(--success); font-weight: 500; }

        /* Feature Grid */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .feature-item {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .feature-item:hover {
            transform: translateY(-2px);
            border-color: rgba(233, 69, 96, 0.3);
        }

        .feature-item .icon { font-size: 28px; margin-bottom: 12px; }
        .feature-item h4 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .feature-item p { font-size: 13px; margin: 0; }

        /* Roadmap */
        .roadmap {
            position: relative;
            padding-left: 32px;
            margin: 24px 0;
        }

        .roadmap::before {
            content: '';
            position: absolute;
            left: 11px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--cta), var(--accent));
        }

        .roadmap-item {
            position: relative;
            padding: 16px 0 24px 24px;
        }

        .roadmap-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 22px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 3px solid var(--cta);
        }

        .roadmap-item.active::before {
            background: var(--cta);
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.2);
        }

        .roadmap-item.completed::before {
            background: var(--success);
            border-color: var(--success);
        }

        .roadmap-item h4 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .roadmap-item p { font-size: 14px; margin: 0; }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: sticky;
            top: 88px;
        }

        .progress-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 24px;
        }

        .progress-card h3 {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cta), #ff6b81);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .lesson-list {
            list-style: none;
            padding: 0;
        }

        .lesson-list li {
            margin-bottom: 2px;
        }

        .lesson-list a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .lesson-list a:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--white);
        }

        .lesson-list a.active {
            background: rgba(233, 69, 96, 0.1);
            color: var(--cta);
            font-weight: 600;
        }

        .lesson-list .lesson-num {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .lesson-list a.active .lesson-num {
            background: var(--cta);
            color: white;
        }

        .lesson-list a.completed .lesson-num {
            background: var(--success);
            color: white;
        }

        /* ========== FOOTER NAV ========== */
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 20px;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 20px 24px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--white);
            flex: 1;
            max-width: 48%;
            transition: border-color 0.2s, transform 0.2s;
        }

        .nav-btn:hover {
            border-color: rgba(233, 69, 96, 0.4);
            transform: translateY(-2px);
        }

        .nav-btn.next { align-items: flex-end; text-align: right; }

        .nav-btn .nav-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cta);
        }

        .nav-btn .nav-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ========== SITE FOOTER ========== */
        .site-footer {
            text-align: center;
            padding: 40px 24px;
            color: var(--text-dim);
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 60px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
                gap: 0;
                padding: 24px 16px;
            }

            .sidebar {
                position: relative;
                top: 0;
                order: -1;
                margin-bottom: 32px;
            }

            .content h1 { font-size: 28px; }
            .content h2 { font-size: 20px; }

            .breadcrumb { display: none; }

            .footer-nav { flex-direction: column; }
            .nav-btn { max-width: 100%; }
            .nav-btn.next { align-items: flex-start; text-align: left; }

            .comparison-table { font-size: 13px; }
            .comparison-table th, .comparison-table td { padding: 10px 12px; }

            .feature-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .feature-grid { grid-template-columns: 1fr; }
            .header-inner { height: 56px; }
            .logo { font-size: 17px; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <a href="#" class="logo">
                <div class="logo-icon">A</div>
                AutomatikLabs
            </a>
            <nav class="breadcrumb">
                <a href="#">Agents OpenClaw</a>
                <span class="sep">/</span>
                <a href="#">{{MODULO}}</a>
                <span class="sep">/</span>
                <span class="current">{{AULA_CURTA}}</span>
            </nav>
        </div>
    </header>

    <!-- LAYOUT -->
    <div class="layout">

        <!-- MAIN CONTENT -->
        <main class="content">
            <div class="lesson-badge">{{BADGE}}</div>
            <h1>{{TITULO_AULA}}</h1>
            <div class="lesson-meta">
                <span>{{DURACAO}}</span>
                <span>{{NIVEL}}</span>
            </div>

            <!-- === CONTEUDO DA AULA AQUI === -->

            <!-- Footer Navigation -->
            <div class="footer-nav">
                <!-- <a href="aula-anterior.html" class="nav-btn prev">
                    <span class="nav-label">Anterior</span>
                    <span class="nav-title">Nome da aula anterior</span>
                </a> -->
                <!-- <a href="proxima-aula.html" class="nav-btn next">
                    <span class="nav-label">Proxima</span>
                    <span class="nav-title">Nome da proxima aula</span>
                </a> -->
            </div>
        </main>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="progress-card">
                <h3>Progresso do Modulo</h3>
                <div class="progress-bar">

                </ul>

    </div>

    <!-- SITE FOOTER -->
    <footer class="site-footer">

    </footer>

</body>
